name: Build Android APK

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '11076708_latest'
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android/build-cache
          key: ${{ runner.os }}-gradle-${{ hashFiles('app/build.gradle', 'gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace --build-cache

      - name: Display APK info
        run: |
          echo "=== APK Files ==="
          find app/build/outputs/apk -name "*.apk" -exec ls -la {} \;
          echo ""
          echo "=== Debug APK ==="
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            ls -lh app/build/outputs/apk/debug/app-debug.apk
            du -h app/build/outputs/apk/debug/app-debug.apk
          else
            echo "No debug APK found"
          fi
          echo ""
          echo "=== Release APK ==="
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            ls -lh app/build/outputs/apk/release/app-release.apk
            du -h app/build/outputs/apk/release/app-release.apk
          else
            echo "No release APK found"
          fi

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cryptid-scholar-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
